
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eigentum-app
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ".:/var/www/html"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-eigentum}
      DB_USERNAME: ${DB_USERNAME:-eigentum}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql/mysql-server:8.0
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_HOST: "127.0.0.1"
      MYSQL_DATABASE: ${DB_DATABASE:-eigentum}
      MYSQL_USER: ${DB_USERNAME:-eigentum}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
      retries: 10
      timeout: 5s
      interval: 5s
      start_period: 20s

volumes:
  mysql-data:
    driver: local
