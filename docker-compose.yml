services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: eigentum-app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:8000'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            # no credentials on the command line: "access denied" still
            # proves the server is up, so the password stays out of `ps`
            test:
                - CMD
                - mysqladmin
                - ping
                - '-h'
                - '127.0.0.1'
            retries: 10
            timeout: 5s
volumes:
    mysql-data:
        driver: local
